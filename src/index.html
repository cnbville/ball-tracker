<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gridiron Live</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/showtime.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="st">
  <header class="titlebar" data-tauri-drag-region>
    <span class="st-brand" data-tauri-drag-region>Gridiron <span>Live</span></span>
    <div class="seg" role="tablist" aria-label="League">
      <button role="tab" data-league="all" aria-selected="true">All football</button>
      <button role="tab" data-league="cfb" aria-selected="false">College</button>
      <button role="tab" data-league="nfl" aria-selected="false">NFL</button>
    </div>
    <span class="spacer" data-tauri-drag-region></span>
    <span id="updated" class="updated" aria-live="polite">Connecting…</span>
  </header>
  <div class="shell">
    <nav id="sidebar" aria-label="Games">
      <a id="nav-schedule" class="side-nav" href="#/schedule">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        What's on
      </a>
      <div class="side-scroll"></div>
    </nav>
    <main id="room" class="st-room"><i></i><i></i><i></i><div id="view"></div></main>
  </div>
</body>
</html>
